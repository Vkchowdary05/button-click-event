apiVersion: apps/v1
kind: Deployment
metadata:
  name: button-click-deployment
  labels:
    app: button-click-app
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: button-click-app
  template:
    metadata:
      labels:
        app: button-click-app
        tier: frontend
    spec:
      containers:
      - name: button-click-container
        image: button-click-app:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 3
          periodSeconds: 5
